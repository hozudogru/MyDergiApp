name: Deploy MyDergiApp

on:
  push:
    branches:
      - main

concurrency:
  group: mydergiapp-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: .NET 8 kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Proje dosyasını bul
        id: find_project
        run: |
          PROJECT_FILE=$(find . -name "*.csproj" | head -n 1)
          echo "PROJECT_FILE=$PROJECT_FILE" >> $GITHUB_ENV
          echo "Bulunan proje: $PROJECT_FILE"

      - name: Restore
        run: dotnet restore "$PROJECT_FILE"

      - name: Build
        run: dotnet build "$PROJECT_FILE" --configuration Release --no-restore

      - name: Publish
        run: dotnet publish "$PROJECT_FILE" -c Release -o ./publish
      - name: Publish çıktısını kontrol et
        run: |
          echo "Publish klasörü:"
          ls -la ./publish

      - name: Publish paketini hazırla
        run: |
          tar -czf mydergiapp.tar.gz -C ./publish .
          ls -lh mydergiapp.tar.gz

      - name: Paketi sunucuya yükle
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          source: "mydergiapp.tar.gz"
          target: "/tmp/mydergiapp_deploy"
          rm: true

      - name: Canlıya al ve servisi yeniden başlat
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          script: |
            set -e

            # Canli sunucu: 37.148.211.187 (Plesk). Uygulama dergiasp.service ile bu klasorden calisiyor (root, 127.0.0.1:5002);
            # Plesk nginx, dergiasp.com'u 5002'ye proxy'ler (vhost_nginx.conf). appsettings.Production.json bu klasorde durur.
            APP_DIR="/opt/dergiasp"
            SERVICE="dergiasp.service"
            TMP_DIR="/tmp/mydergiapp_deploy"
            BACKUP_DIR="/tmp/mydergiapp_backup"

            mkdir -p "$APP_DIR"
            mkdir -p "$APP_DIR/wwwroot/uploads"
            mkdir -p "$APP_DIR/wwwroot/upload"
            rm -rf "$BACKUP_DIR"
            mkdir -p "$BACKUP_DIR"

            for f in appsettings.json appsettings.Production.json appsettings.Development.json; do
              if [ -f "$APP_DIR/$f" ]; then
                cp "$APP_DIR/$f" "$BACKUP_DIR/$f"
              fi
            done

            # wwwroot/uploads: kapak, banner vb.  wwwroot/upload: makale dosyalari (main, revisions, ...)
            if [ -d "$APP_DIR/wwwroot/uploads" ]; then
              cp -r "$APP_DIR/wwwroot/uploads" "$BACKUP_DIR/uploads"
            fi

            if [ -d "$APP_DIR/wwwroot/upload" ]; then
              cp -r "$APP_DIR/wwwroot/upload" "$BACKUP_DIR/upload"
            fi

            rm -rf "$APP_DIR"/*

            tar -xzf "$TMP_DIR/mydergiapp.tar.gz" -C "$APP_DIR"

            for f in appsettings.json appsettings.Production.json appsettings.Development.json; do
              if [ -f "$BACKUP_DIR/$f" ]; then
                cp "$BACKUP_DIR/$f" "$APP_DIR/$f"
              fi
            done

            mkdir -p "$APP_DIR/wwwroot/uploads"
            mkdir -p "$APP_DIR/wwwroot/upload"

            if [ -d "$BACKUP_DIR/uploads" ]; then
              cp -r "$BACKUP_DIR/uploads/." "$APP_DIR/wwwroot/uploads/" || true
            fi

            if [ -d "$BACKUP_DIR/upload" ]; then
              cp -r "$BACKUP_DIR/upload/." "$APP_DIR/wwwroot/upload/" || true
            fi

            # Servis root olarak calisiyor; ayri bir deploy kullanicisi yok, chown gerekmez
            chmod -R 755 "$APP_DIR"
            chmod -R 775 "$APP_DIR/wwwroot/uploads" "$APP_DIR/wwwroot/upload"

            systemctl daemon-reload
            systemctl restart "$SERVICE"
            systemctl status "$SERVICE" --no-pager -l

            rm -rf "$TMP_DIR"
            rm -rf "$BACKUP_DIR"
